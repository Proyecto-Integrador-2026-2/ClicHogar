# SonarQube Server local (Community) para analizar ClicHogar sin SonarCloud.
# Uso: `docker compose -f docker-compose.sonarqube.yml up -d`
#   o simplemente `bash scripts/sonar-local.sh`, que lo levanta y analiza.
# Panel: http://localhost:9000 (admin / admin la primera vez).
#
# Usa la base H2 embebida: suficiente para uso local y desechable.
services:
  sonarqube:
    image: sonarqube:community
    container_name: clichogar-sonarqube
    ports:
      - '9000:9000'
    environment:
      # Evita exigir vm.max_map_count en Linux (uso local, no producción).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:9000/api/system/status | grep -q UP',
        ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
