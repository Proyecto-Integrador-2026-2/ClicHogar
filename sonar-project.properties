
sonar.projectKey=Proyecto-Integrador-2026-2_ClicHogar
sonar.organization=proyecto-integrador-2026-2

sonar.sources=frontend/src,backend

sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,dist/**,frontend/.astro/**,backend/drizzle/**

# Cobertura LCOV generada por `bun test --coverage` en el CI (ver `.github/workflows/ci.yml`).
# Rutas relativas a la raíz, que es donde corre el scanner.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info