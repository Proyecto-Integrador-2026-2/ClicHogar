name: Integracion Continua Clic Hogar

# 1. ¿CUÁNDO DESPERTAR AL ROBOT?
# Se activará cuando alguien intente unir código a la rama 'main' (Pull Request)
# o cuando se empuje código directamente a 'main'.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# 2. ¿QUÉ TRABAJO HARÁ EL ROBOT?
jobs:
  revision-de-codigo:
    # El robot alquilará una computadora temporal con Linux (Ubuntu) en la nube
    runs-on: ubuntu-latest

    # 3. LOS PASOS DE LA REVISIÓN
    steps:
      - name: 1. Descargar nuestro código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Esto es obligatorio para que SonarCloud lea el historial

      - name: 2. Instalar el motor Bun
        uses: oven-sh/setup-bun@v2

      - name: 3. Instalar herramientas del Frontend y Backend
        # El símbolo '|' permite escribir varios comandos de terminal en distintas líneas
        run: |
          cd frontend && bun install
          cd ../backend && bun install

      - name: 4. Generar cobertura LCOV para SonarCloud
        # `bun test --coverage` deja `coverage/lcov.info` en cada paquete.
        # Las rutas se declaran en `sonar-project.properties`
        # (`sonar.javascript.lcov.reportPaths`). El `sed` prefija el
        # paquete porque Bun escribe `SF:` relativo al cwd y Sonar lo
        # resuelve desde la raíz (CI = ubuntu, GNU sed).
        run: |
          cd frontend && bun test --coverage --coverage-reporter=lcov
          sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info
          cd ../backend && bun test --coverage --coverage-reporter=lcov
          sed -i 's|^SF:|SF:backend/|' coverage/lcov.info

      - name: 5. Revisar que el formato sea idéntico (Prettier)
        run: |
          bunx prettier --check .

      - name: 6. Buscar errores lógicos (ESLint)
        run: |
          cd frontend && bun run lint
          cd ../backend && bun run lint

      - name: 7. Analizar seguridad con SonarCloud
        # Esta es una acción prefabricada por SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          # Estas son contraseñas secretas que configuraremos en GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
